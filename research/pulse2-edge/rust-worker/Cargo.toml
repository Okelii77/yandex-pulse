[package]
name="pulse2-edge-rust"
version="0.1.0"
edition="2021"
publish=false
[lib]
crate-type=["cdylib"]
[dependencies]
worker={version="=0.9.0",features=["d1"]}
serde={version="=1.0.219",features=["derive"]}
