name: Frontend Lab (offline)
on:
  push:
    branches: ['research/pulse-architecture-20261128']
    paths: ['research/frontend-lab/**','.github/workflows/frontend-lab.yml']
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/research/pulse-architecture-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/frontend-lab/profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-lab-evidence
          retention-days: 1
          if-no-files-found: warn
          path: research/frontend-lab/frontend-results.json
