name: Archive RC2 native evidence
on:
  push:
    branches: ['research/pulse-architecture-20261128']
    paths: ['.github/workflows/pulse2-rc2-archive.yml']
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse2-rc-evidence
          run-id: 46148309969
          github-token: ${{ github.token }}
          path: /tmp/rc2-native
      - run: |
          set -eu
          test "${GITHUB_REF}" = refs/heads/research/pulse-architecture-20261128
          mkdir -p research/results/pulse2/rc2-native-artifacts
          cp -r /tmp/rc2-native/. research/results/pulse2/rc2-native-artifacts/
          cp "$(find /tmp/rc2-native -name Cargo.lock -print -quit)" research/pulse2-rc/Cargo.lock
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research/results/pulse2/rc2-native-artifacts research/pulse2-rc/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m 'RC2: archive native measurements and unified TLS dependency lock'
          git push origin HEAD:refs/heads/research/pulse-architecture-20261128
