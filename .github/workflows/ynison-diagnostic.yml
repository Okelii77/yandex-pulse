name: Yandex Pulse · Ynison independent diagnostic

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Select one client; the shared gate applies to both'
        type: choice
        options: [javascript, python]
        default: javascript

permissions:
  contents: read
  id-token: write

concurrency:
  group: pulse-ynison-comparison
  cancel-in-progress: false

jobs:
  diagnose:
    name: Independent diagnostic (guarded)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS transport without install scripts
        if: inputs.client == 'javascript'
        run: npm install --prefix monitor/ynison_alt --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        if: inputs.client == 'python'
        with:
          python-version: '3.12'
      - name: Install pinned Python SDK
        if: inputs.client == 'python'
        run: python -m pip install 'yandex-music[ynison]==3.2.2'
      - name: Diagnose with server go-away protection
        env:
          YANDEX_MUSIC_TOKEN: ${{ secrets.YANDEX_MUSIC_TOKEN }}
          PULSE_DIAGNOSTIC_CLIENT: ${{ inputs.client }}
        run: |
          if [ "$PULSE_DIAGNOSTIC_CLIENT" = python ]; then
            python monitor/ynison_alt/diagnose.py
          else
            node monitor/ynison_alt/diagnose.mjs
          fi
      - name: Publish sanitized result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ynison-diagnostic
          path: ynison-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
