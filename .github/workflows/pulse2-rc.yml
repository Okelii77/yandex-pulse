name: Pulse 2.0 RC integration (offline)
on:
  push:
    branches: ['research/pulse-architecture-20261128']
    paths: ['research/pulse2-rc/**','.github/workflows/pulse2-rc.yml']
permissions:
  contents: read
jobs:
  rc:
    if: github.ref == 'refs/heads/research/pulse-architecture-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: research/pulse2-rc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup default stable && cargo generate-lockfile && cargo build --locked --release
      - run: go build -trimpath -ldflags='-s -w' -o core-go core.go
      - run: python test_native.py && python test_music.py
      - name: Native payload through D1 and browser
        working-directory: research/pulse2-control
        run: |
          npm install --no-audit --no-fund
          ./node_modules/.bin/tsc --target es2022 --module es2022 --outDir dist worker.ts
          node full.mjs
      - name: Existing production regression suite (offline)
        working-directory: .
        run: |
          python -m unittest discover -s monitor -p 'test_*.py'
          node --test worker/test/*.test.mjs monitor/ynison_alt/*.test.mjs monitor/test_live_api.cjs monitor/test_dashboard.cjs research/pulse2-rc/test_frontend_rc.cjs
          node monitor/test_dashboard_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse2-rc-evidence
          retention-days: 1
          if-no-files-found: warn
          path: |
            research/pulse2-rc/native-results.json
            research/pulse2-rc/music-contract-results.json
            research/pulse2-rc/Cargo.lock
            research/pulse2-control/full-results.json
