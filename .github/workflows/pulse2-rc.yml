name: Pulse 2.0 RC integration (offline)
on:
  push:
    branches: ['research/pulse-architecture-20261128']
    paths: ['research/pulse2-rc/**','.github/workflows/pulse2-rc.yml']
permissions:
  contents: read
jobs:
  rc:
    if: github.ref == 'refs/heads/research/pulse-architecture-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: research/pulse2-rc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - run: rustup toolchain install 1.100.1 --profile minimal && rustc +1.100.1 --version && cargo +1.100.1 build --release && cargo +1.100.1 tree -e features > dependency-features.txt
      - run: go build -trimpath -ldflags='-s -w' -o core-go core.go
      - run: |
          go version
          python --version
          wc -c core-go target/release/pulse-core-rc
          python test_native.py && python test_music.py && python test_adapters.py
      - name: Native payload through D1 and browser
        working-directory: research/pulse2-control
        run: |
          npm install --no-audit --no-fund
          ./node_modules/.bin/tsc --target es2022 --module es2022 --outDir dist worker.ts
          node full.mjs
      - name: Existing production regression suite (offline)
        if: always()
        working-directory: .
        run: |
          python -m unittest discover -s monitor -p 'test_*.py'
          node --test worker/test/*.test.mjs monitor/ynison_alt/*.test.mjs monitor/test_live_api.cjs monitor/test_dashboard.cjs research/pulse2-rc/test_frontend_rc.cjs
          node monitor/test_dashboard_browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pulse2-rc-evidence
          retention-days: 1
          if-no-files-found: warn
          path: |
            research/pulse2-rc/native-results.json
            research/pulse2-rc/music-contract-results.json
            research/pulse2-rc/Cargo.lock
            research/pulse2-rc/dependency-features.txt
            research/pulse2-control/full-results.json
