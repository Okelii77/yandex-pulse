# RC2 registration: synthetic-only. No schedules, no production credentials.
name: Pulse 2.0 staging dispatch (synthetic only)
run-name: RC2 ${{ inputs.slot }} ${{ inputs.lease }}
on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Reserved staging slot, optional for manual fallback'
        required: false
        type: string
      lease:
        description: 'Public dispatch correlation UUID, never a credential'
        required: false
        type: string
permissions:
  contents: read
  id-token: write
  attestations: read
jobs:
  stage:
    if: github.repository == 'Okelii77/yandex-pulse' && github.ref == 'refs/heads/research/pulse-architecture-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: pulse-rc2-synthetic
      cancel-in-progress: false
    environment: pulse-rc
    steps:
      - name: Check environment opt-in
        env:
          ENABLED: ${{ vars.PULSE_RC2_SYNTHETIC_ENABLED }}
        run: test "$ENABLED" = 1
      - name: Require pinned observation commit before loading project code
        env:
          EXPECTED_SHA: ${{ vars.PULSE_RC_PINNED_SHA }}
        run: test -n "$EXPECTED_SHA" && test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - name: Verify GitHub signed provenance (no untrusted binary execution)
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED_SHA: ${{ vars.PULSE_RC_ATTESTED_COMMIT }}
        run: |
          set -eu
          test "$ATTESTED_SHA" = 18f15b2abf6830de930b637ee764d030a884bfc5
          gh attestation verify research/results/pulse2/rc2-prebuilt/pulse-core-rc --repo Okelii77/yandex-pulse --signer-workflow Okelii77/yandex-pulse/.github/workflows/pulse2-rc2-provenance.yml --signer-digest "$ATTESTED_SHA" --source-digest "$ATTESTED_SHA" --deny-self-hosted-runners
      - name: Verify prebuilt Core without rebuilding
        run: |
          set -eu
          test "$(git rev-parse HEAD:research/pulse2-rc)" = "$(git rev-parse 18f15b2abf6830de930b637ee764d030a884bfc5:research/pulse2-rc)"
          python research/pulse2-control/prebuilt-core.py
      - name: Synthetic staging snapshot (no Yandex requests)
        run: python research/pulse2-control/run-synthetic.py
        env:
          PULSE_RC2_SYNTHETIC_ENABLED: ${{ vars.PULSE_RC2_SYNTHETIC_ENABLED }}
          PULSE_RC_API_URL: ${{ vars.PULSE_RC_API_URL }}
          PULSE_RC_SLOT: ${{ inputs.slot }}
          PULSE_RC_LEASE: ${{ inputs.lease }}
