name: RC2 dependency audit (offline service fixtures)
on:
  push:
    branches: ['research/pulse-architecture-20261128']
    paths: ['.github/workflows/pulse2-rc2-security.yml','research/pulse2-rc/Cargo.toml','research/pulse2-control/requirements.in','research/pulse2-control/package.json']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - name: Resolve isolated dependency locks and audit
        working-directory: research/pulse2-control
        run: |
          rustup toolchain install 1.100.1 --profile minimal
          cargo +1.100.1 generate-lockfile --manifest-path ../pulse2-rc/Cargo.toml
          python -m venv /tmp/rc-audit
          /tmp/rc-audit/bin/pip install 'pip-tools==7.5.2'
          /tmp/rc-audit/bin/pip-compile --generate-hashes --output-file requirements.lock requirements.in
          python -m venv /tmp/rc-adapters
          /tmp/rc-adapters/bin/pip install --require-hashes -r requirements.lock
          /tmp/rc-adapters/bin/pip freeze > python-resolved.txt
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          python security_scan.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pulse2-rc2-security
          retention-days: 1
          if-no-files-found: warn
          path: |
            research/pulse2-control/requirements.lock
            research/pulse2-control/python-resolved.txt
            research/pulse2-control/package-lock.json
            research/pulse2-control/security-results.json
            research/pulse2-rc/Cargo.lock
