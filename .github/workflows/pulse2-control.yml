name: Pulse 2.0 RC control plane (offline)
on:
  push:
    branches: ['research/pulse-architecture-20261128']
    paths: ['research/pulse2-control/**','.github/workflows/pulse2-control.yml']
permissions:
  contents: read
jobs:
  control:
    if: github.ref == 'refs/heads/research/pulse-architecture-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/pulse2-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: ./node_modules/.bin/tsc --target es2022 --module es2022 --outDir dist worker.ts
      - run: node test-stage-config.mjs && node test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pulse2-control-evidence
          retention-days: 1
          if-no-files-found: warn
          path: research/pulse2-control/control-results.json
