name: Pulse 2.0 frontend and dispatch contracts
on:
  push:
    branches: ['research/pulse-architecture-20261128']
    paths: ['research/pulse2-contract/**','.github/workflows/pulse2-contract.yml']
permissions:
  contents: read
jobs:
  contracts:
    if: github.ref == 'refs/heads/research/pulse-architecture-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    defaults:
      run:
        working-directory: research/pulse2-contract
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test.mjs && python quota.py
