name: Yandex Pulse · Check & Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/status.json'
      - 'site/history.json'
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      publish_site:
        description: 'Republish website after frontend changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yandex-pulse-production
  cancel-in-progress: false

jobs:
  probe:
    name: Synthetic checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor/requirements.txt
      - name: Install optional music clients
        run: python -m pip install -r monitor/requirements.txt
      - name: Build app icons
        run: python monitor/build_icons.py
      - name: Validate Python and offline tests
        run: |
          python -m compileall -q monitor
          python -m unittest discover -s monitor -p "test_*.py" -v
      - name: Validate web chart behavior
        run: |
          node --check site/app.js
          node monitor/test_graph.cjs
          node --check site/live-api.js
          node --check monitor/ynison_alt/diagnose.mjs
          node --test monitor/ynison_alt/state-confirmation.test.mjs
          node --test worker/test/*.test.mjs
      - name: Verify Cloudflare manual-trigger readiness
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "https://yandex-pulse-api.oleg-pulse-03.workers.dev/api/health"
          try:
              with urllib.request.urlopen(url, timeout=15) as response:
                  health = json.load(response)
              print("Cloudflare API:", "reachable" if health.get("ok") else "unhealthy")
              print("Trigger secrets:", "configured" if health.get("trigger_ready") is True else "missing/inactive")
              if health.get("trigger_ready") is not True:
                  raise SystemExit("Manual trigger not ready")
          except Exception as e:
              print("Health check failed:", type(e).__name__)
              raise
          PY
      - name: Restore cooldown from Cloudflare D1
        env:
          PULSE_API_URL: https://yandex-pulse-api.oleg-pulse-03.workers.dev
        run: python monitor/load_previous.py
      - name: Check Yandex endpoints
        env:
          YANDEX_MUSIC_TOKEN: ${{ secrets.YANDEX_MUSIC_TOKEN }}
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
          YANDEX_WIKI_TOKEN: ${{ secrets.YANDEX_WIKI_TOKEN }}
          YANDEX_WIKI_ORG_ID: ${{ vars.YANDEX_WIKI_ORG_ID || secrets.YANDEX_WIKI_ORG_ID }}
          YANDEX_WIKI_TEST_SLUG: ${{ vars.YANDEX_WIKI_TEST_SLUG || secrets.YANDEX_WIKI_TEST_SLUG }}
          YC_IAM_TOKEN: ${{ secrets.YC_IAM_TOKEN }}
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID || secrets.YC_FOLDER_ID }}
          YC_MONITORING_API_KEY: ${{ secrets.YC_MONITORING_API_KEY }}
          YC_AI_API_KEY: ${{ secrets.YC_AI_API_KEY }}
          YC_SPEECHKIT_API_KEY: ${{ secrets.YC_SPEECHKIT_API_KEY }}
          YC_VISION_API_KEY: ${{ secrets.YC_VISION_API_KEY }}
          YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
          PULSE_ENABLE_BILLABLE_PROBES: ${{ vars.PULSE_ENABLE_BILLABLE_PROBES }}
        run: python monitor/check.py
      - name: Upload results directly to D1 via GitHub OIDC
        env:
          PULSE_API_URL: https://yandex-pulse-api.oleg-pulse-03.workers.dev
        run: python monitor/upload_live.py
      - name: Configure public frontend API
        if: github.event_name == 'push' || inputs.publish_site == true
        env:
          PULSE_API_URL: https://yandex-pulse-api.oleg-pulse-03.workers.dev
          PULSE_TURNSTILE_SITE_KEY: 0x4AAAAAAFeL0-z-eWNZ-Aai
        run: python monitor/build_site_config.py
      - name: Upload site
        if: github.event_name == 'push' || inputs.publish_site == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish Pages
    needs: probe
    if: github.event_name == 'push' || inputs.publish_site == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
