name: Yandex Pulse · Check & Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/status.json'
      - 'site/history.json'
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yandex-pulse-production
  cancel-in-progress: false

jobs:
  probe:
    name: Synthetic checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor/requirements.txt
      - name: Install optional music clients
        run: python -m pip install -r monitor/requirements.txt
      - name: Validate Python and offline tests
        run: |
          python -m compileall -q monitor
          python -m unittest discover -s monitor -p "test_*.py" -v
      - name: Check Yandex endpoints
        env:
          YANDEX_MUSIC_TOKEN: ${{ secrets.YANDEX_MUSIC_TOKEN }}
        run: python monitor/check.py
      - name: Save rolling results (no secrets or account data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/status.json site/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh synthetic probes [skip ci]"
            git push
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish Pages
    needs: probe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
